# Refreshes jobs.json from the Tier A sources in pipeline/companies.yaml and commits it when it changed.
# The push triggers Cloudflare Workers Builds, which deploys the site (same as any other push to main).
name: Update jobs

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (PRD section 8), off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Parser tests (saved real samples)
        run: python -m pytest -q pipeline/tests

      # SQLite state (first/last seen, missed cycles) survives between runs through the Actions cache.
      # If the cache is gone the pipeline starts fresh: jobs keep their posted dates from the sources.
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/jobs.sqlite
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Fetch sources and export jobs.json
        run: python -m pipeline.run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/jobs.sqlite
          key: jobs-db-${{ github.run_id }}

      - name: Commit jobs.json if it changed
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then echo "jobs.json unchanged"; exit 0; fi
          git commit -m "Update jobs.json ($(python -c 'import json;d=json.load(open("jobs.json"));print(len(d["jobs"]),"jobs")'))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
