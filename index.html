<!doctype html>
<html lang="id" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Loker Indonesia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--mute:#5d6675;--line:#e1e5eb;--accent:#4f46e5;--accent-ink:#fff;
--hot:#ff6b35;--warm:#f5b700;--cool:#2ec4b6;--ok:#16794c;--okbg:#e3f5ec;--warn:#8a5a00;--warnbg:#fdf0d5;--off:#5d6675;--offbg:#eceff3;
--map-bg:#dbe7f2;--land:#f3f1ea;--land-id:#fffdf6;--coast:#a9b3c1}
:root[data-theme=dark]{--bg:#0e1116;--panel:#171b22;--ink:#e8ecf2;--mute:#97a1b0;--line:#2a313c;--accent:#8b83ff;--accent-ink:#0e1116;
--ok:#6fd3a0;--okbg:#10301f;--warn:#f1c35d;--warnbg:#33290f;--off:#97a1b0;--offbg:#222831;
--map-bg:#0b1a2b;--land:#1a222c;--land-id:#222d3a;--coast:#3b4858}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0e1116;--panel:#171b22;--ink:#e8ecf2;--mute:#97a1b0;--line:#2a313c;--accent:#8b83ff;--accent-ink:#0e1116;
--ok:#6fd3a0;--okbg:#10301f;--warn:#f1c35d;--warnbg:#33290f;--off:#97a1b0;--offbg:#222831;
--map-bg:#0b1a2b;--land:#1a222c;--land-id:#222d3a;--coast:#3b4858}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:min(420px,42vw) 1fr;height:100dvh}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.head h1{font-size:17px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px}
.demo{margin:8px 16px 0;padding:5px 9px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:12px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button,.btn,select,input{font:inherit;color:inherit}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-within,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.filters{border-bottom:1px solid var(--line)}
details.filters>summary{padding:10px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.filters>summary::-webkit-details-marker{display:none}
.fgrid{padding:0 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fgrid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.dd{position:relative}
.dd>summary{font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink);list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd>summary::-webkit-details-marker{display:none}
.ddlist{position:absolute;z-index:6;left:0;right:-40px;top:calc(100% + 4px);max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.f .ddlist label{flex-direction:row;display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer}
.f .ddlist input{width:auto;padding:0;border:0;background:none;margin:0}
.ddlist label:hover{background:var(--bg)}
.ddlist small{margin-left:auto;color:var(--mute)}
.results-bar{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.results-bar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
#list{overflow:auto;flex:1;min-height:0;padding:8px 10px 16px}
.job{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--bg)}
.job.applied{opacity:.6}
.job h3{font-size:14px;margin:0 0 1px}
.job .co{color:var(--mute);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 6px;font-size:12px}
.tag{padding:2px 7px;border-radius:6px;background:var(--offbg);color:var(--off)}
.tag.verified{background:var(--okbg);color:var(--ok)}
.tag.unverified{background:var(--warnbg);color:var(--warn)}
.tag.fresh{background:var(--hot);color:#fff}
.tag.sal{background:transparent;border:1px solid var(--line);color:var(--ink)}
.acts{display:flex;gap:6px;align-items:center}
.acts a{background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:8px;padding:5px 10px;font-size:13px}
.acts a[aria-disabled=true]{background:var(--offbg);color:var(--mute);pointer-events:none}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--map-bg)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;z-index:2;max-width:260px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2;align-items:flex-end}
.lbl{font-size:11px;font-weight:600;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap;cursor:pointer;transform:translateY(4px)}
.lbl.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);font-size:12.5px;border-radius:8px;padding:6px 9px}
.maplibregl-popup-tip{display:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;z-index:3;display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:44dvh 1fr}
  .mapwrap{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line)}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" aria-label="Filter dan daftar lowongan">
    <div class="head">
      <h1>Radar Loker Indonesia</h1>
      <div class="sub" id="meta">Memuat data…</div>
      <div class="tools">
        <label class="btn" title="Muat berkas jobs.json hasil pipeline"><input id="file" type="file" accept=".json,application/json" hidden>Muat jobs.json</label>
        <button id="theme" type="button" aria-label="Ganti tema">Tema</button>
        <button id="clear" type="button">Reset filter</button>
      </div>
    </div>
    <div class="demo" id="demo" hidden><b>Data contoh, bukan lowongan asli.</b> Muat <code>jobs.json</code> untuk data nyata.</div>
    <details class="filters" id="filters" open>
      <summary>Filter <span class="sub" id="fsum"></span></summary>
      <div class="fgrid">
        <label class="f full">Cari posisi atau perusahaan<input id="q" type="search" placeholder="mis. IT Manager, Tbk, data"></label>
        <div class="f">Industri<details class="dd" id="indDD"><summary id="indSum">Semua industri</summary><div class="ddlist" id="industries"></div></details></div>
        <label class="f">Perusahaan<input id="company" list="companies" placeholder="Semua"><datalist id="companies"></datalist></label>
        <label class="f">Diposting<select id="since"><option value="0">Kapan saja</option><option value="24">24 jam terakhir</option><option value="72">3 hari terakhir</option><option value="168">7 hari terakhir</option><option value="720">30 hari terakhir</option></select></label>
        <label class="f">Lokasi kerja<select id="work"><option value="">Semua</option><option value="onsite">Di kantor</option><option value="hybrid">Hybrid</option><option value="remote">Remote</option></select></label>
        <label class="f">Gaji min (juta/bln)<input id="salMin" type="number" min="0" step="1" placeholder="0"></label>
        <label class="f">Gaji maks (juta/bln)<input id="salMax" type="number" min="0" step="1" placeholder="tanpa batas"></label>
        <label class="f full">Provinsi<select id="province"><option value="">Semua</option></select></label>
        <label class="chk"><input id="verOnly" type="checkbox"> Hanya terverifikasi</label>
        <label class="chk"><input id="savedOnly" type="checkbox"> Hanya yang disimpan</label>
        <label class="chk full"><input id="unkSal" type="checkbox" checked> Tampilkan yang gajinya tidak tercantum</label>
      </div>
    </details>
    <div class="results-bar"><span id="count"></span>
      <label>Urutkan <select id="sort"><option value="new">Terbaru</option><option value="sal">Gaji tertinggi</option></select></label></div>
    <div id="list" role="list"></div>
  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="Peta 3D lowongan per kota"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="mapctl">
      <button id="reset" type="button">Reset kamera</button>
      <button id="online" type="button" aria-pressed="false" title="Memakai peta online (butuh internet)">Peta detail</button>
    </div>
    <div class="legend" aria-label="Legenda">
      <div><b>Tinggi</b> = jumlah lowongan (setelah filter)</div>
      <div><i style="background:var(--hot)"></i>≤ 24 jam <i style="background:var(--warm);margin-left:6px"></i>≤ 3 hari <i style="background:var(--cool);margin-left:6px"></i>lebih lama</div>
      <div class="sub">Klik batang untuk menyaring kota. Geser dengan Ctrl/⌥ untuk memiringkan.</div>
    </div>
  </main>
</div>

function normalizeJob(r){
  if(!r||typeof r!=="object") return null;
  const s=(v)=>typeof v==="string"?v.trim():"";

  if(city&&CITIES[city]){ [lng,lat]=CITIES[city]; prov=prov||CITIES[city][2]; }

  if(f.ver&&validity(j)!=="verified") return false;
  if(f.saved&&!state.marks[j.id]) return false;
  const hasSal=j.salMin||j.salMax;
  if(!hasSal){ if(!f.unk||f.salMin||f.salMax) return false; }
  else { const lo=j.salMin||j.salMax, hi=j.salMax||j.salMin; if(f.salMin&&hi<f.salMin) return false; if(f.salMax&&lo>f.salMax) return false; }
  if(skip!=="ind"&&state.ind.size&&!state.ind.has(j.industry)) return false;
  if(skip!=="city"&&state.city&&j.city!==state.city) return false;
  return true;
}

/* ------------------------------------------------------------------ rendering: panel */
let shown=60;
function render(){
  const f=readFilters();
  const pool=state.jobs.filter((j)=>passes(j,f,"city"));        // for the map: ignores city selection
  const list=pool.filter((j)=>!state.city||j.city===state.city);
  const key=$("sort").value;
  list.sort(key==="sal"?(a,b)=>((b.salMax||b.salMin||0)-(a.salMax||a.salMin||0))||(b.posted-a.posted):(a,b)=>b.posted-a.posted);
  // industry chips use counts that ignore the industry filter itself
  const cnt={}; state.jobs.forEach((j)=>{ if(passes(j,f,"ind")) cnt[j.industry]=(cnt[j.industry]||0)+1; });
  const inds=[...new Set(state.jobs.map((j)=>j.industry))].sort();
  $("industries").innerHTML=inds.map((i)=>`<label><input type="checkbox" data-ind="${esc(i)}" ${state.ind.has(i)?"checked":""}> ${esc(i)}<small>${cnt[i]||0}</small></label>`).join("");
  $("indSum").textContent=state.ind.size?`${state.ind.size} industri dipilih`:"Semua industri";
  $("count").textContent=`${list.length} lowongan${state.city?` di ${state.city}`:""}`;
  $("fsum").textContent=activeCount(f)?`(${activeCount(f)} aktif)`:"";
  const box=$("list");
  if(!list.length){ box.innerHTML=`<div class="empty">Tidak ada lowongan yang cocok.<br>Coba longgarkan filter.</div>`; }
  else {
    box.innerHTML=list.slice(0,shown).map(card).join("")+(list.length>shown?`<div class="empty"><button type="button" id="more">Tampilkan lebih banyak (${list.length-shown})</button></div>`:"");
  }
  updateMap(pool);
}
function activeCount(f){return [f.q,f.company,f.since,f.salMin,f.salMax,!f.unk,f.work,f.province,f.ver,f.saved,state.ind.size,state.city].filter(Boolean).length;}
function card(j){
  const v=validity(j), m=state.marks[j.id], fresh=Date.now()-j.posted<=DAY;
  const vt=v==="verified"?`<span class="tag verified" title="Sumber resmi dan dicek ulang">Terverifikasi</span>`:`<span class="tag unverified" title="Belum cocok dengan situs resmi perusahaan">Belum diverifikasi</span>`;
  const wt={onsite:"Di kantor",hybrid:"Hybrid",remote:"Remote"}[j.work];
  return `<article class="job ${m==="applied"?"applied":""}" role="listitem" data-id="${esc(j.id)}">
    <h3>${esc(j.title)}</h3><div class="co">${esc(j.company)} · ${esc(j.city)}${j.province?`, ${esc(j.province)}`:""}</div>
    <div class="meta">${fresh?`<span class="tag fresh">Baru</span>`:""}<span class="tag">${ago(j.posted)}</span><span class="tag sal">${esc(rupiah(j))}</span>
      <span class="tag">${wt}</span><span class="tag">${esc(j.industry)}</span>${vt}${j.source?`<span class="tag">${esc(j.source)}</span>`:""}</div>
    <div class="acts"><a href="${j.url?esc(j.url):"#"}" target="_blank" rel="noopener noreferrer" ${j.url?"":'aria-disabled="true"'}>${j.url?"Buka & lamar":"Tautan contoh"}</a>
      <button type="button" data-mark="saved" aria-pressed="${m==="saved"}">${m==="saved"?"★ Disimpan":"☆ Simpan"}</button>
      <button type="button" data-mark="applied" aria-pressed="${m==="applied"}">${m==="applied"?"✓ Sudah dilamar":"Tandai dilamar"}</button></div></article>`;
}

/* ------------------------------------------------------------------ map */
let map, markers=[], mapReady=false, LAND=null, lastPool=[], popup;
const ID_BOUNDS=[[94.8,-11.3],[141.6,6.3]];
function fitIndonesia(animate){ map.fitBounds(ID_BOUNDS,{padding:innerWidth<=820?10:{top:30,bottom:30,left:20,right:20},pitch:55,bearing:-12,duration:animate?900:0,maxZoom:6}); }
const OFFLINE_STYLE={version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#dbe7f2"}}]};
const ONLINE_STYLE=()=>isDark()?"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json":"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json";
function isDark(){const t=document.documentElement.dataset.theme;return t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);}
const cssv=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function initMap(){
  const mobile=innerWidth<=820;
  map=new maplibregl.Map({container:"map",style:OFFLINE_STYLE,bounds:ID_BOUNDS,fitBoundsOptions:{padding:mobile?10:{top:30,bottom:30,left:20,right:20},pitch:55,bearing:-12,maxZoom:6},pitch:55,bearing:-12,maxPitch:75,
    attributionControl:{compact:true,customAttribution:"Peta dasar: Natural Earth (domain publik)"}});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
  popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:12});
  map.on("style.load",installLayers);
  map.on("zoom",throttle(()=>updateMap(lastPool,true)));
  map.on("move",throttle(positionLabelsVisibility));
  map.on("mousemove","bars",(e)=>{const p=e.features[0].properties;map.getCanvas().style.cursor="pointer";
    popup.setLngLat(e.lngLat).setHTML(`<b>${esc(p.city)}</b>: ${p.n} lowongan<br>terbaru ${ago(+p.newest)}`).addTo(map);});
  map.on("mouseleave","bars",()=>{map.getCanvas().style.cursor="";popup.remove();});
  map.on("click","bars",(e)=>selectCity(e.features[0].properties.city));
  map.on("error",()=>{ if(state.online&&!mapReady) setOnline(false,"Peta online tidak bisa dimuat. Kembali ke peta bawaan."); }); // tile errors after load are ignored
}
function installLayers(){
  const online=state.online;
  if(!online){
    map.setPaintProperty("bg","background-color",cssv("--map-bg"));
    map.addSource("land",{type:"geojson",data:LAND});
    map.addLayer({id:"land",type:"fill",source:"land",paint:{"fill-color":["case",["==",["get","n"],1],cssv("--land-id"),cssv("--land")]}});
    map.addLayer({id:"coast",type:"line",source:"land",paint:{"line-color":cssv("--coast"),"line-width":.7}});
  }
  map.addSource("bars",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"bars",type:"fill-extrusion",source:"bars",paint:{"fill-extrusion-color":["get","c"],"fill-extrusion-height":["get","h"],"fill-extrusion-base":0,"fill-extrusion-opacity":.92}});
  mapReady=true; updateMap(lastPool);
}
function throttle(fn){let r=0;return()=>{if(r)return;r=requestAnimationFrame(()=>{r=0;fn();});};}
function metersPerPx(lat,z){return 78271.517*Math.cos(lat*Math.PI/180)/Math.pow(2,z);}

function updateMap(pool,zoomOnly){
  lastPool=pool; if(!mapReady||!map.getSource("bars")) return;
  const g={}; // aggregate by city
  for(const j of pool){ if(j.lng==null) continue; const c=g[j.city]||(g[j.city]={city:j.city,lng:j.lng,lat:j.lat,n:0,newest:0}); c.n++; if(j.posted>c.newest)c.newest=j.posted; }
  const z=map.getZoom(), ppd=512*Math.pow(2,z)/360, feats=[];
  const cities=Object.values(g).sort((a,b)=>b.n-a.n);
  for(const c of cities){
    const r=Math.min(0.8,8/ppd), rl=r*Math.cos(c.lat*Math.PI/180), pts=[];
    for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6;pts.push([c.lng+r*Math.cos(a),c.lat+rl*Math.sin(a)]);} pts.push(pts[0]);
    const hpx=Math.min(150,18+13*Math.sqrt(c.n)), age=Date.now()-c.newest;
    const col=state.city===c.city?COLORS.sel:(age<=DAY?COLORS.hot:(age<=3*DAY?COLORS.warm:COLORS.cool));
    feats.push({type:"Feature",properties:{city:c.city,n:c.n,newest:c.newest,c:col,h:hpx*metersPerPx(c.lat,z)},geometry:{type:"Polygon",coordinates:[pts]}});
  }
  map.getSource("bars").setData({type:"FeatureCollection",features:feats});
  if(!zoomOnly) updateLabels(cities); else positionLabelsVisibility(cities);
  window.__bars=feats.length;
}
function updateLabels(cities){
  markers.forEach((m)=>m.remove()); markers=[];
  cities.forEach((c,i)=>{ const el=document.createElement("div"); el.className="lbl"+(state.city===c.city?" sel":""); el.dataset.rank=i;
    el.textContent=`${c.city} ${c.n}`; el.addEventListener("click",(ev)=>{ev.stopPropagation();selectCity(c.city);});
    markers.push(new maplibregl.Marker({element:el,anchor:"top",pitchAlignment:"viewport",rotationAlignment:"viewport"}).setLngLat([c.lng,c.lat]).addTo(map)); });
  positionLabelsVisibility(cities);
}
function positionLabelsVisibility(){
  // Greedy label declutter in screen space: higher-ranked (more jobs) labels win, selected city always shows.
  if(!map) return; const taken=[];
  const order=[...markers].sort((a,b)=>(b.getElement().classList.contains("sel")-a.getElement().classList.contains("sel"))||(+a.getElement().dataset.rank-+b.getElement().dataset.rank));
  for(const m of order){ const el=m.getElement(), p=map.project(m.getLngLat()), w=el.textContent.length*6.4+14;
    const box=[p.x-w/2,p.y+2,p.x+w/2,p.y+22];
    const hit=taken.some((t)=>box[0]<t[2]&&box[2]>t[0]&&box[1]<t[3]&&box[3]>t[1]);
    el.style.display=hit?"none":""; if(!hit) taken.push(box); }
}
function selectCity(city){ state.city=state.city===city?null:city; shown=60; render(); if(state.city){ $("list").scrollTop=0; } }
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000);}
function setOnline(on,msg){
  state.online=on; $("online").setAttribute("aria-pressed",on); $("online").classList.toggle("on",on); mapReady=false;
  map.setStyle(on?ONLINE_STYLE():OFFLINE_STYLE); if(msg) toast(msg);
}

/* ------------------------------------------------------------------ boot */
function setJobs(raw,generatedAt,demo){
  const rows=Array.isArray(raw)?raw:(raw&&raw.jobs)||[]; let dropped=0;
  const jobs=[]; const seen=new Set();
  for(const r of rows){ const j=normalizeJob(r); if(!j||seen.has(j.id)){dropped++;continue;} seen.add(j.id); jobs.push(j); }
  state.jobs=jobs; state.demo=demo; state.generatedAt=generatedAt||null; state.city=null; state.ind.clear(); shown=60;
  $("demo").hidden=!demo;
  const co=[...new Set(jobs.map((j)=>j.company))].sort(); $("companies").innerHTML=co.map((c)=>`<option value="${esc(c)}">`).join("");
  const pv=[...new Set(jobs.map((j)=>j.province).filter(Boolean))].sort(); const cur=$("province").value;
  $("province").innerHTML=`<option value="">Semua</option>`+pv.map((p)=>`<option ${p===cur?"selected":""}>${esc(p)}</option>`).join("");
  const upd=generatedAt?`diperbarui ${ago(Date.parse(generatedAt))}`:(demo?"data contoh":"");
  $("meta").textContent=`${jobs.length} lowongan aktif tercatat · ${upd}${dropped?` · ${dropped} baris dilewati karena tidak valid`:""}`;
  render();
}
async function boot(){
  loadMarks();
  try{ state.theme=localStorage.getItem("jobradar.theme")||"auto"; }catch(e){}
  document.documentElement.dataset.theme=state.theme;
  LAND=JSON.parse($("land-data").textContent);
  if(innerWidth<=820) $("filters").open=false;
  initMap();
  let loaded=false;
  try{ if(location.protocol==="file:") throw 0; const r=await fetch("jobs.json",{cache:"no-store"}); if(r.ok){ const d=await r.json(); setJobs(d,d.generated_at,false); loaded=true; } }catch(e){}
  if(!loaded) setJobs(demoJobs(),null,true);
}
document.addEventListener("input",(e)=>{
  const t=e.target; if(t.dataset&&t.dataset.ind){ t.checked?state.ind.add(t.dataset.ind):state.ind.delete(t.dataset.ind); shown=60; render(); return; }
  if(t.closest(".fgrid,.results-bar")){ shown=60; render(); } });
document.addEventListener("click",(e)=>{
  if(!e.target.closest("#indDD")) $("indDD").open=false;
  if(e.target.id==="more"){ shown+=60; render(); return; }
  const mk=e.target.closest("[data-mark]"); if(mk){ const id=mk.closest(".job").dataset.id, t=mk.dataset.mark; state.marks[id]===t?delete state.marks[id]:state.marks[id]=t; saveMarks(); render(); }
});
$("clear").onclick=()=>{ document.querySelectorAll(".fgrid input[type=text],.fgrid input[type=search],.fgrid input[type=number]").forEach((i)=>i.value="");
  $("since").value="0";$("work").value="";$("province").value="";$("unkSal").checked=true;$("verOnly").checked=false;$("savedOnly").checked=false;
  state.ind.clear();state.city=null;shown=60;render(); };
$("reset").onclick=()=>fitIndonesia(true);
$("online").onclick=()=>setOnline(!state.online);
$("theme").onclick=()=>{ const order=["auto","light","dark"]; state.theme=order[(order.indexOf(state.theme)+1)%3];
  document.documentElement.dataset.theme=state.theme; try{localStorage.setItem("jobradar.theme",state.theme);}catch(e){}
  toast("Tema: "+({auto:"otomatis",light:"terang",dark:"gelap"}[state.theme])); mapReady=false; map.setStyle(state.online?ONLINE_STYLE():OFFLINE_STYLE); };
$("file").onchange=async(e)=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); setJobs(d,d.generated_at,false); toast("Data dimuat dari "+f.name); }catch(err){ toast("Berkas tidak valid: bukan JSON yang benar."); } e.target.value=""; };
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") $("indDD").open=false; });
window.JobRadar={state,normalizeJob,validity,passes,readFilters,render};
boot();
</script>
</body>
