# Target companies and their public ATS boards (Tier A, PRD section 5).
# Each board below was checked on 2026-11-25: it answered on the documented public endpoint and had Indonesian postings,
# and its API host's robots.txt allows our User-Agent.
#   industry: one of the fixed taxonomy in PRD section 6
#   website:  official site; used for the "apply link on company domain" trust rule and the company profile
#   sources:  greenhouse {board} | lever {site} | workable {account}
# Not usable today: SmartRecruiters boards (Grab, Bosch, Alodokter, BukuWarung, Stockbit, Sayurbox, Julo) because
# api.smartrecruiters.com/robots.txt disallows all agents except LinkedInBot; Ashby (robots.txt unreadable).

- name: Xendit
  industry: Perbankan & Keuangan
  website: https://www.xendit.co
  sources:
    - {type: greenhouse, board: xendit}

