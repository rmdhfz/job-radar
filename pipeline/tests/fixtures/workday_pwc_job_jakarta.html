    <meta name="description" property="og:description" content="Line of Service Advisory Industry/Sector Not Applicable Specialism Operations Management Level Manager Job Description &amp;amp; Summary At PwC, our people in operations consulting specialise in providing consulting services on optimising operational efficiency and effectiveness. These individuals analyse client needs, develop operational strategies, and offer guidance and support to help clients streamline processes, improve productivity, and drive business performance. In connected supply chain at PwC, you will focus on optimising supply chain operations and improving end-to-end visibility and collaboration. You will work closely with clients to analyse supply chain processes, identify areas for improvement, and develop strategies to enhance efficiency, reduce costs, and increase responsiveness. Working in this area, you will provide guidance on technology and data analytics to create a connected and agile supply chain network. At PwC, our people in operations consulting help clients work more efficiently and effectively. They look closely at how a client&#39;s business runs, design practical operating strategies, and support clients as they put them in place so that strategy turns into measurable performance. Have you led logistics in Indonesian industry and want to shape how whole organisations move goods, make decisions and use technology? Join our Strategy &amp;amp; Operations team. We work with asset-heavy and industrial clients on transformations that improve how their businesses actually run. About The Role As a Manager, you&#39;ll lead business process transformation across a range of clients and assignments. These range from logistics diagnostics and operating model redesign to the business side of technology-enabled change, such as transportation management system (TMS) and SAP S/4HANA programmes. You&#39;ll connect operations, leadership and technology teams so that new processes and systems deliver real, measurable value. You&#39;ll also grow your own leadership. You&#39;ll coach and develop your team, build trusted relationships with senior client leaders, and deliver quality work that makes a difference. What You&#39;ll Do Lead logistics and supply chain transformation Run diagnostics of inbound, outbound and inter-site logistics, covering current-state mapping, performance baselines, root-cause analysis and improvement opportunities. Design target operating models, organisation structures and governance for logistics and supply chain functions, including roles, decision rights and review routines. Standardise end-to-end processes across sites and business units, and define SOPs, controls and KPIs. Deliver measurable cost and performance improvements. Shape technology-enabled change from the business side Work with process owners to turn business needs into clear system requirements. Support TMS strategy and vendor selection through business cases, options assessments and implementation roadmaps. Work alongside SAP and technology teams so that business outcomes, not system features, drive solution design. Lead clients and engagements Manage workstreams on large engagements, covering scope, plans, deliverables, quality and status reporting. Build trusted relationships with Heads of Logistics, Supply Chain Directors and operations leaders. Facilitate senior-level workshops and steering committees. Grow the practice and our people Shape proposals, solution approaches and estimates, and present them to clients. Build knowledge and thought leadership assets for the practice. Lead, coach and review the work of Consultants and Senior Associates, and contribute to recruitment and team development. What You&#39;ll Bring Mandatory 8+ years of experience in logistics, combining industry roles in Indonesia with management consulting or transformation roles. A proven track record in business process transformation, covering process redesign, SOPs, KPIs, operating models and governance. Experience leading teams and managing deliverables in a client or matrix environment. Native Bahasa Indonesia and fluent English. What sets you apart Experience in heavy industry or natural resources, such as pulp and paper, mining, oil and gas, or agribusiness. Business or process-side experience on at least one TMS or SAP S/4HANA (SAP TM) implementation, covering requirements, design, testing and adoption. Exposure to multimodal, port, barge or container logistics. A Big 4 or strategy/operations consulting background. Lean / Six Sigma certification (Green Belt or higher). Skills in analytics tools such as Power BI and Excel modelling. Education: Bachelor&#39;s degree in Industrial Engineering, Supply Chain / Logistics, Transport / Maritime Management, or a related field. Certifications (preferred): Lean / Six Sigma Green Belt or higher Desired Languages: Bahasa Indonesia, English Travel Requirements: Typically 20–40%, depending on assignment. Why PwC At PwC, you&#39;ll be part of a community of solvers who lead with trust and create distinctive outcomes for our clients and communities. You&#39;ll work on complex, high-impact transformations, learn from experienced practitioners across our network, and get the support, flexibility and development you need to grow your career and your impact. Education (if blank, degree and/or field of study not specified) Degrees/Field of Study required: Degrees/Field of Study preferred: Certifications (if blank, certifications not specified) Required Skills Optional Skills Accepting Feedback, Accepting Feedback, Active Listening, AI Fluency, AI-Human Collaboration, Analytical Thinking, Budgetary Management, Business Planning, Coaching and Feedback, Communication, Cost Accounting, Cost Management, Creativity, Design for Flexibility, Digital Tooling, Distribution Channel Optimization, Embracing Change, Emotional Regulation, Empathy, Establishing Inventory Levels, Financial Management, Inclusion, Intellectual Curiosity, Inventory Management, Learning Agility {+ 23 more} Desired Languages (If blank, desired languages not specified) Travel Requirements Available for Work Visa Sponsorship? Government Clearance Required? Job Posting End Date Are you ready to make a difference? Want to unlock new value by applying your unique perspective and talents? You can grow exponentially at PwC. Here, you can uncover hidden talents, build lifelong relationships rooted in trust and empathy and turn challenges into opportunities for innovation. We’ll help you grow your skills through challenging, meaningful work so you can go further.">
